<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0 16px 16px;
    font: 12px/1.5 "Inter", -apple-system, "Segoe UI", sans-serif;
    color: #16181d; background: #fff;
  }
  header { position: sticky; top: 0; background: #fff; padding: 14px 0 10px; z-index: 5; }
  h1 { font-size: 13px; margin: 0 0 10px; letter-spacing: -0.01em; }
  .steps { display: flex; gap: 6px; }
  .steps div {
    flex: 1; height: 3px; border-radius: 2px; background: #e6e8ec;
  }
  .steps div.on { background: #16181d; }
  .steps div.done { background: #9aa0a8; }
  .stepname { font-size: 10px; color: #7c828c; margin-top: 6px; }

  label { display: block; font-size: 10px; color: #7c828c; margin: 10px 0 3px; letter-spacing: .02em; }
  input, select, textarea {
    width: 100%; padding: 7px 9px; font: 11px/1.45 inherit;
    border: 1px solid #d9dce1; border-radius: 5px; background: #fff; color: inherit;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #16181d; }
  textarea { resize: vertical; font-family: "SF Mono", Menlo, Consolas, monospace; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }

  button {
    width: 100%; padding: 10px; margin-top: 10px;
    font: 600 12px/1 inherit; border: 0; border-radius: 6px;
    background: #16181d; color: #fff; cursor: pointer;
  }
  button:hover:not(:disabled) { background: #33373f; }
  button:disabled { background: #c9ccd1; cursor: default; }
  button.ghost { background: #f1f2f4; color: #16181d; }
  button.ghost:hover:not(:disabled) { background: #e4e6e9; }
  .btnrow { display: flex; gap: 8px; }

  .drop {
    border: 1px dashed #c9ccd1; border-radius: 6px; padding: 16px;
    text-align: center; color: #7c828c; cursor: pointer; margin-top: 4px;
  }
  .drop.over { border-color: #16181d; background: #f7f8f9; color: #16181d; }
  .drop b { display: block; color: #16181d; font-size: 11px; margin-bottom: 2px; }

  .card {
    border: 1px solid #e6e8ec; border-radius: 6px;
    padding: 9px 11px; margin-bottom: 6px; font-size: 11px;
  }
  .card b { display: block; margin-bottom: 2px; }
  .card .role { color: #7c828c; font-size: 10px; letter-spacing: .05em; }
  .card .why { color: #7c828c; margin-top: 4px; font-size: 10px; line-height: 1.5; }
  .card.bad { border-color: #e8b4b0; background: #fdf6f5; }
  .card .over { color: #b3261e; font-size: 10px; margin-top: 3px; }

  .checks { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 10px; }
  .checks label { display: flex; align-items: center; gap: 5px; margin: 0; font-size: 11px; color: #16181d; }
  .checks input { width: auto; }

  #status { margin-top: 9px; min-height: 15px; font-size: 11px; }
  .ok { color: #12784a; } .err { color: #b3261e; } .wait { color: #7c828c; }
  .note { font-size: 10px; color: #9aa0a8; line-height: 1.55; margin-top: 8px; }
  .warn { background: #fff8e6; border: 1px solid #f0dca8; border-radius: 6px; padding: 9px 11px; margin-top: 10px; font-size: 10px; line-height: 1.6; }
  .warn b { display: block; margin-bottom: 3px; color: #7a5a00; }
  .hide { display: none; }
  details { border: 1px solid #e6e8ec; border-radius: 6px; margin-top: 10px; }
  summary { padding: 8px 11px; cursor: pointer; font-weight: 600; font-size: 11px; }
  details .body { padding: 0 11px 11px; }
</style>

<header>
  <h1>카드뉴스 기획 스튜디오</h1>
  <div class="steps">
    <div id="s1" class="on"></div><div id="s2"></div><div id="s3"></div>
  </div>
  <div class="stepname" id="stepname">1단계 · 자료 넣기</div>
</header>

<!-- ───────── 1단계 ───────── -->
<section id="step1">
  <label>자료 파일</label>
  <div class="drop" id="drop">
    <b>파일을 여기로 끌어놓으세요</b>
    txt · md 파일 · 클릭해서 고를 수도 있어요
  </div>
  <input type="file" id="file" accept=".txt,.md,.markdown" multiple class="hide" />

  <label>또는 직접 붙여넣기</label>
  <textarea id="input" rows="7" placeholder="완성된 카드뉴스의 문구, 제품 설명, 캡션 등을 그대로 넣으세요."></textarea>

  <div class="row">
    <div>
      <label>카드 수</label>
      <select id="count"><option>4</option><option>5</option><option selected>6</option><option>7</option><option>8</option></select>
    </div>
    <div>
      <label>톤</label>
      <select id="tone">
        <option value="product">제품 소개형</option>
        <option value="info">정보 정리형</option>
        <option value="insight">인사이트 분석형</option>
      </select>
    </div>
    <div>
      <label>상황</label>
      <select id="mode">
        <option value="역구성">이미 만든 것</option>
        <option value="신규">앞으로 만들 것</option>
      </select>
    </div>
  </div>

  <button id="to2">다음 · 기획하기</button>
</section>

<!-- ───────── 2단계 ───────── -->
<section id="step2" class="hide">
  <label>방법</label>
  <select id="provider">
    <option value="manual">claude.ai에 붙여넣기 (무료)</option>
    <option value="gemini">Gemini API (무료 한도)</option>
    <option value="anthropic">Claude API (유료)</option>
  </select>

  <div id="apiBox" class="hide">
    <div class="row">
      <div><label>API 키</label><input id="apikey" type="password" placeholder="이 컴퓨터에만 저장됩니다" /></div>
      <div><label>모델</label><input id="model" placeholder="비워두면 기본값" /></div>
    </div>
    <button id="gen">기획 생성</button>
  </div>

  <div id="manualBox">
    <button id="copy">① 프롬프트 복사하기</button>
    <p class="note">
      복사한 걸 claude.ai 새 대화창에 붙여넣으세요. 돌아온 JSON을 통째로 복사해
      아래 칸에 붙여넣으면 됩니다.
    </p>
    <textarea id="promptOut" rows="3" readonly class="hide"></textarea>
  </div>

  <label>② 결과 붙여넣기</label>
  <textarea id="json" rows="7" placeholder='{ "project": ... }'></textarea>
  <button id="load" class="ghost">불러오기</button>

  <div id="preview"></div>

  <div class="btnrow">
    <button id="back1" class="ghost">이전</button>
    <button id="to3" disabled>다음 · 디자인</button>
  </div>
</section>

<!-- ───────── 3단계 ───────── -->
<section id="step3" class="hide">
  <div class="row">
    <div><label>브랜드명</label><input id="brandName" placeholder="비워도 됩니다" /></div>
    <div><label>계정 핸들</label><input id="handle" placeholder="@account" /></div>
  </div>
  <div class="row">
    <div><label>메인 컬러</label><input id="brandColor" placeholder="#1A1A1A" /></div>
    <div><label>포인트 컬러</label><input id="accentColor" placeholder="#FFD84D" /></div>
    <div><label>비교 대조색</label><input id="subColor" placeholder="#3A5AA8" /></div>
  </div>
  <div class="row">
    <div>
      <label>디자인 테마 (AI가 blocks를 짜서 보내면 무시됩니다)</label>
      <select id="theme">
        <option value="clean">clean · 흰 지면, 컬러 최소 (제품 소개)</option>
        <option value="soft">soft · 연한 지면, 둥근 카드 (정보 정리)</option>
        <option value="bold">bold · 어두운 지면, 큰 타이포 (인사이트)</option>
        <option value="editorial">editorial · 넓은 여백, 장식 없음 (브랜드 스토리)</option>
      </select>
    </div>
  </div>
  <div>
    <label>비율</label>
    <select id="ratio">
      <option value="1080x1350">4:5 세로 (1080×1350)</option>
      <option value="1080x1080">1:1 정방형 (1080×1080)</option>
      <option value="1200x900">4:3 가로 (1200×900)</option>
    </select>
  </div>

  <label>만들 보드</label>
  <div class="checks">
    <label><input type="checkbox" id="optPrd" checked /> PRD</label>
    <label><input type="checkbox" id="optTree" checked /> 기능명세</label>
    <label><input type="checkbox" id="optFlow" checked /> 유저플로우</label>
    <label><input type="checkbox" id="optWire" checked /> 와이어프레임</label>
    <label><input type="checkbox" id="optDesign" checked /> 카드 시안</label>
  </div>

  <button id="render">피그마에 생성</button>
  <div id="warnBox"></div>
  <div class="btnrow"><button id="back2" class="ghost">이전</button></div>
</section>

<div id="status"></div>

<script>
const $ = (id) => document.getElementById(id);
const S = $('status');
const FIELDS = ['provider','model','apikey','brandName','handle','brandColor','accentColor','subColor','theme','ratio','count','tone','mode'];
const DEFAULT_MODEL = { anthropic: 'claude-sonnet-5', gemini: 'gemini-2.5-flash', manual: '' };
const STEPNAME = ['1단계 · 자료 넣기', '2단계 · 기획하기', '3단계 · 디자인'];
let plan = null;
let step = 1;

function say(m, cls) { S.className = cls || ''; S.textContent = m || ''; }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function go(n) {
  step = n;
  [1,2,3].forEach((i) => {
    $('step' + i).classList.toggle('hide', i !== n);
    const bar = $('s' + i);
    bar.className = i === n ? 'on' : (i < n ? 'done' : '');
  });
  $('stepname').textContent = STEPNAME[n - 1];
  say('');
  window.scrollTo(0, 0);
}

/* ── 설정 저장 ── */
parent.postMessage({ pluginMessage: { type: 'load-settings' } }, '*');
function save() {
  const d = {};
  FIELDS.forEach((k) => { if ($(k)) d[k] = $(k).value; });
  parent.postMessage({ pluginMessage: { type: 'save-settings', data: d } }, '*');
}
FIELDS.forEach((k) => { if ($(k)) $(k).addEventListener('change', save); });

/* ── 1단계: 파일 넣기 ── */
const drop = $('drop');
drop.onclick = () => $('file').click();
drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); readFiles(e.dataTransfer.files); };
$('file').onchange = (e) => readFiles(e.target.files);

function readFiles(files) {
  const list = Array.prototype.slice.call(files);
  if (!list.length) return;
  let done = 0;
  const parts = new Array(list.length);
  list.forEach((f, i) => {
    const r = new FileReader();
    r.onload = () => {
      parts[i] = '--- ' + f.name + ' ---\\n' + r.result;
      if (++done === list.length) {
        $('input').value = ($('input').value ? $('input').value + '\\n\\n' : '') + parts.join('\\n\\n');
        say(list.length + '개 파일을 읽었습니다.', 'ok');
      }
    };
    r.onerror = () => say(f.name + ' 을 읽지 못했습니다.', 'err');
    r.readAsText(f, 'utf-8');
  });
}

$('to2').onclick = () => {
  if (!$('input').value.trim()) { say('자료를 넣어주세요.', 'err'); return; }
  save();
  buildPrompt();
  go(2);
};

/* ── 프롬프트 ── */
const SYSTEM = [

  '- sub 50자 / body 항목 34자 / compare 항목 30자 / summary 60자',

const TONE_HINT = {
  product: '제품 소개형. 사진이 주인공이고 구매 판단 정보가 핵심이다. 안전·사이즈·기준 같은 대응표를 한 장 넣어라.',
  info: '정보 정리형. 오해를 먼저 깨고 정답을 준다. compare 레이아웃으로 개념을 나란히 놓고 summary로 차이를 한 줄 정리해라.',
  insight: '인사이트 분석형. 사례로 시작해 판단 기준으로 끝낸다. 독자가 자기 상황에 대입할 축을 compare로 제시해라.',

function userPrompt() {
  return [
    '카드뉴스 ' + $('count').value + '장으로 기획해라.',
    'prd.mode 는 "' + $('mode').value + '" 로 설정해라.',
    TONE_HINT[$('tone').value],
    '',
    '--- 자료 ---',
    $('input').value.trim(),
  ].join('\\n');
}

function buildPrompt() { $('promptOut').value = SYSTEM + '\\n\\n' + userPrompt(); }

/* ── 2단계 ── */
function syncProvider() {
  const m = $('provider').value;
  $('manualBox').classList.toggle('hide', m !== 'manual');
  $('apiBox').classList.toggle('hide', m === 'manual');
}
$('provider').onchange = () => { syncProvider(); save(); };

$('copy').onclick = () => {
  buildPrompt();
  const t = $('promptOut');
  t.classList.remove('hide');
  t.focus(); t.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  if (ok) { t.classList.add('hide'); say('복사했습니다. claude.ai에 붙여넣으세요.', 'ok'); }
  else say('자동 복사가 막혔습니다. 위 칸이 선택돼 있으니 Ctrl+C 를 누르세요.', 'wait');
};

$('load').onclick = () => {
  const raw = $('json').value.trim();
  if (!raw) { say('결과를 붙여넣어주세요.', 'err'); return; }
  const clean = raw.replace(/^[\\s\\S]*?(\\{)/, '$1').replace(/```/g, '').trim();
  let d;
  try { d = JSON.parse(clean); }
  catch (e) { say('JSON 형식이 깨졌습니다. { 부터 } 까지 전부 붙여넣었는지 확인하세요.', 'err'); return; }
  showPreview(d);
};

const LIMIT = { headline: 24, sub: 50, body: 34, summary: 60, compare: 30 };

function showPreview(d) {
  const missing = [];
  if (!d.prd) missing.push('prd');
  if (!d.features) missing.push('features');
  if (!d.flow) missing.push('flow');
  if (!d.cards || !d.cards.length) missing.push('cards');
  if (missing.length) { say('빠진 항목: ' + missing.join(', ') + ' — 다시 생성해보세요.', 'err'); return; }

  plan = d;
  const box = $('preview');
  box.innerHTML = '';
  let over = 0;

  d.cards.forEach((c, i) => {
    const bad = [];
    String(c.headline || '').split('\n').forEach((l) => { if (l.length > LIMIT.headline) bad.push('헤드라인 ' + l.length + '자'); });
    if ((c.sub || '').length > LIMIT.sub) bad.push('서브 ' + c.sub.length + '자');
    (c.body || []).forEach((b) => { if (b.length > LIMIT.body) bad.push('본문 ' + b.length + '자'); });
    if ((c.summary || '').length > LIMIT.summary) bad.push('요약 ' + c.summary.length + '자');
    const cm = c.compare || {};
    ['left','right'].forEach((k) => ((cm[k] || {}).items || []).forEach((it) => { if (it.length > LIMIT.compare) bad.push('비교항목 ' + it.length + '자'); }));
    if (bad.length) over++;

    const el = document.createElement('div');
    el.className = 'card' + (bad.length ? ' bad' : '');
    el.innerHTML =
      '<div class="role">' + esc(c.id || ('C' + (i + 1))) + ' · ' + esc(c.role || '') + ' · ' + esc(c.layout || '') + '</div>' +
      '<b>' + esc(String(c.headline || '').replace(/\n/g, ' / ')) + '</b>' +
      (c.sub ? '<div>' + esc(c.sub) + '</div>' : '') +
      (c.why ? '<div class="why">' + esc(c.why) + '</div>' : '') +
      (bad.length ? '<div class="over">글자 초과 — ' + esc(bad.join(', ')) + '</div>' : '');
    box.appendChild(el);
  });

  $('to3').disabled = false;
  const imp = ((d.prd || {}).improvements || []).length;
  say('카드 ' + d.cards.length + '장 · 개선점 ' + imp + '개'
      + (over ? ' · 글자 초과 ' + over + '장 (JSON에서 줄이세요)' : ' · 글자 수 이상 없음'),
      over ? 'wait' : 'ok');
}

$('gen').onclick = async () => {
  const key = $('apikey').value.trim();
  if (!key) { say('API 키를 입력하세요.', 'err'); return; }
  $('gen').disabled = true;
  say('기획하는 중… 20~40초 걸립니다', 'wait');
  try {
    const d = await callLLM();
    $('json').value = JSON.stringify(d, null, 2);
    showPreview(d);
  } catch (e) { say(e.message, 'err'); }
  $('gen').disabled = false;
};

async function callLLM() {
  const key = $('apikey').value.trim();
  const provider = $('provider').value;
  const model = $('model').value.trim() || DEFAULT_MODEL[provider];
  let raw;
  if (provider === 'anthropic') {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-api-key': key,
        'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: model, max_tokens: 6000, system: SYSTEM,
        messages: [{ role: 'user', content: userPrompt() }] }),
    });
    const j = await res.json();
    if (!res.ok) throw new Error((j.error && j.error.message) || ('API 오류 ' + res.status));
    raw = (j.content || []).filter((b) => b.type === 'text').map((b) => b.text).join('\n');
  } else {
    const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + model + ':generateContent', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-goog-api-key': key },
      body: JSON.stringify({
        systemInstruction: { parts: [{ text: SYSTEM }] },
        contents: [{ role: 'user', parts: [{ text: userPrompt() }] }],
        generationConfig: { responseMimeType: 'application/json', maxOutputTokens: 6000 },
      }),
    });
    const j = await res.json();
    if (!res.ok) throw new Error((j.error && j.error.message) || ('API 오류 ' + res.status));
    const c = j.candidates && j.candidates[0];
    raw = c && c.content && c.content.parts ? c.content.parts.map((p) => p.text || '').join('') : '';
  }
  const clean = raw.replace(/^[\s\S]*?(\{)/, '$1').replace(/```/g, '').trim();
  try { return JSON.parse(clean); }
  catch (e) { throw new Error('응답을 JSON으로 읽지 못했습니다. 다시 시도해보세요.'); }
}

$('back1').onclick = () => go(1);
const TONE_THEME = { product: 'clean', info: 'soft', insight: 'bold' };
$('to3').onclick = () => {
  if (!$('theme').dataset.touched) $('theme').value = TONE_THEME[$('tone').value] || 'clean';
  save(); go(3);
};
$('theme').addEventListener('change', () => { $('theme').dataset.touched = '1'; });
$('back2').onclick = () => go(2);

/* ── 3단계 ── */
$('render').onclick = () => {
  if (!plan) { say('먼저 기획 결과를 불러오세요.', 'err'); return; }
  save();
  const wh = $('ratio').value.split('x');
  $('warnBox').innerHTML = '';
  parent.postMessage({ pluginMessage: { type: 'render', data: plan, opts: {
    cardW: Number(wh[0]), cardH: Number(wh[1]),
    brandColor: $('brandColor').value.trim() || '#1A1A1A',
    accentColor: $('accentColor').value.trim() || '#FFD84D',
    subColor: $('subColor').value.trim() || '#3A5AA8',
    theme: $('theme').value,
    brandName: $('brandName').value.trim(),
    handle: $('handle').value.trim(),
    prd: $('optPrd').checked, tree: $('optTree').checked, flow: $('optFlow').checked,
    wire: $('optWire').checked, design: $('optDesign').checked,
  } } }, '*');
  say('피그마에 그리는 중…', 'wait');
};

onmessage = (e) => {
  const m = e.data.pluginMessage;
  if (!m) return;
  if (m.type === 'settings' && m.data) {
    FIELDS.forEach((k) => { if ($(k) && m.data[k] != null) $(k).value = m.data[k]; });
    syncProvider();
  }
  if (m.type === 'done') {
    say('완료. 캔버스를 확인하세요. (폰트: ' + m.font + ')', 'ok');
    if (m.warnings && m.warnings.length) {
      $('warnBox').innerHTML = '<div class="warn"><b>다듬을 곳</b>' +
        m.warnings.map((w) => '· ' + esc(w)).join('<br>') + '</div>';
    }
  }
  if (m.type === 'error') say(m.message, 'err');
};

syncProvider();
</script>
